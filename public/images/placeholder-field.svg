<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D27" />
      <stop offset="50%" stop-color="#2F6B3D" />
      <stop offset="100%" stop-color="#1E3E26" />
    </linearGradient>
    <pattern id="grassStripe" width="80" height="500" patternUnits="userSpaceOnUse">
      <rect width="40" height="500" fill="rgba(255,255,255,0.03)" />
      <rect x="40" width="40" height="500" fill="rgba(0,0,0,0.04)" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#pitchGrad)" />
  <rect width="800" height="500" fill="url(#grassStripe)" />
  <!-- Pitch Lines -->
  <rect x="40" y="30" width="720" height="440" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" rx="8" />
  <line x1="400" y1="30" x2="400" y2="470" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  <circle cx="400" cy="250" r="70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  <circle cx="400" cy="250" r="5" fill="rgba(255,255,255,0.6)" />
  <!-- Penalty Areas -->
  <path d="M 40 140 C 130 140 130 360 40 360 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  <circle cx="100" cy="250" r="4" fill="rgba(255,255,255,0.6)" />
  <path d="M 760 140 C 670 140 670 360 760 360 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  <circle cx="700" cy="250" r="4" fill="rgba(255,255,255,0.6)" />
  <!-- Center Badge -->
  <rect x="300" y="215" width="200" height="70" rx="16" fill="rgba(23,35,27,0.75)" backdrop-filter="blur(8px)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <text x="400" y="248" fill="#F7F7F2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">FUTSALKITA</text>
  <text x="400" y="268" fill="#A3CFAB" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Arena Lapangan Futsal</text>
</svg>
